<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Myofaskiaalinen harjoittelu</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1720;
      color: white;
    }

    .hero {
      max-width: 1000px;
      margin: auto;
      padding: 60px 20px;
    }

    h1 {
      font-size: 52px;
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 2px;
      color: #d4b06a;
    }

    .subtitle {
      text-align: center;
      font-size: 22px;
      color: #d7d7d7;
      margin-bottom: 50px;
    }

    .video-box {
      background: #18222f;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    iframe {
      width: 100%;
      height: 560px;
      border: none;
    }

    .content {
      padding: 40px;
      line-height: 1.8;
      color: #d7d7d7;
      font-size: 18px;
    }

    .button-area {
      text-align: center;
      margin-top: 40px;
    }

    .button {
      display: inline-block;
      background: #d4b06a;
      color: #111;
      padding: 18px 34px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      transition: 0.3s;
    }

    .button:hover {
      opacity: 0.9;
    }

    @media (max-width: 768px) {

      h1 {
        font-size: 34px;
      }

      .subtitle {
        font-size: 18px;
      }

      iframe {
        height: 260px;
      }

      .content {
        padding: 24px;
        font-size: 16px;
      }
    }

  </style>
</head>

<body>

  <div class="hero">

    <h1>MYOFASKIAALINEN HARJOITTELU</h1>

    <div class="subtitle">
      Kohti joustavampaa kehoa
    </div>

    <div class="video-box">

      <iframe
        src="https://www.youtube.com/embed/mmaK0wUW2vM"
        title="Perustietoa harjoittelusta"
        allowfullscreen>
      </iframe>

      <div class="content">

        <p>
          Harjoittelu auttaa kehoa palautumaan ja lisäämään liikkuvuutta
          lempeällä ja turvallisella tavalla.
        </p>

        <p>
          Voit edetä omaan tahtiin ja pysähtyä hetkeksi kuuntelemaan kehoa.
        </p>

        <div class="button-area">
          <a href="#" class="button">
            Aloita harjoittelu
          </a>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
