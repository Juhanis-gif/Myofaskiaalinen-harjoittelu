 <!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Myofaskiaalinen harjoittelu</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f1ea;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      margin-bottom: 40px;
    }

    .video-box {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    iframe {
      width: 100%;
      height: 500px;
      border: none;
    }

    .content {
      padding: 24px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Myofaskiaalinen harjoittelu</h1>

    <p>
      Tervetuloa harjoituksen pariin.
    </p>

    <div class="video-box">

      <iframe
        src=https://www.youtube.com/embed/mmaK0wUW2vM
        title="Myofaskiaalinen harjoittelu"
        allowfullscreen>
      </iframe>

      <div class="content">
        <h2>Testivideo</h2>

        <p>
          Tämä on ensimmäinen harjoitusvideo.
        </p>
      </div>

    </div>

  </div>

</body>
</html>
